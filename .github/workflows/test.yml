name: build and test

on:
  push:
    branches: [ master, code-refactoring ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # sdks/ holds the JavaCard SDK used by the converter

      # One JDK for everything. The CAP still targets JavaCard 3.0.4: the build runs the v25.0
      # converter with targetsdk="3.0.4", so it is not tied to the 3.0.4 SDK's JDK 11 limit.
      # 17 is the floor because JCardEngine (the test simulator) is Java 17 bytecode.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build the CAP
        run: ./gradlew --no-daemon convertJavacard

      - name: Show CAP contents
        run: java -jar gp.jar --info --cap build/javacard/org/satochip/applet/javacard/applet.cap

      # Card compatibility is the thing a toolchain change could silently break, so assert it
      # rather than eyeballing the step above.
      - name: Assert the CAP still targets JavaCard 3.0.4 with both applets
        run: |
          info=$(java -jar gp.jar --info --cap build/javacard/org/satochip/applet/javacard/applet.cap)
          echo "$info" | grep -q 'applets for JavaCard 3.0.4'          || { echo "::error::CAP no longer targets JavaCard 3.0.4"; exit 1; }
          echo "$info" | grep -q 'v1.5 javacard.framework'             || { echo "::error::javacard.framework import is not v1.5"; exit 1; }
          echo "$info" | grep -q 'v1.5 javacard.security'              || { echo "::error::javacard.security import is not v1.5"; exit 1; }
          echo "$info" | grep -q '5361746F4368697000'                  || { echo "::error::CardEdge AID missing"; exit 1; }
          echo "$info" | grep -q '5361746F4368697001'                  || { echo "::error::NDEFApplet AID missing"; exit 1; }

      # 'simulator' rather than the default 'card': CI has no reader, and the card target would
      # reflash whatever card were present.
      - name: Test against the JCardEngine simulator
        run: ./gradlew --no-daemon test -Porg.satochip.test.target=simulator

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload the CAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applet-cap
          path: build/javacard/org/satochip/applet/javacard/applet.cap
          if-no-files-found: ignore
