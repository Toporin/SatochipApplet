plugins {
  id 'java'
}

repositories {
  mavenCentral()
  maven { url = uri('https://jitpack.io') }
  maven { url = uri('https://mvn.javacard.pro/maven/') }
}

dependencies {
  implementation 'com.github.status-im.status-keycard-java:desktop:4.0.0'
  implementation 'com.github.martinpaljak:apdu4j-pcsc:25.03.11'
  implementation 'com.github.martinpaljak:apdu4j-jnasmartcardio:25.03.11'
  implementation 'org.bouncycastle:bcprov-jdk15on:1.65'
}
