apply plugin: 'javacard'

project.ext.set("com.fidesmo.gradle.javacard.home", "./sdks/jc304_kit")

buildscript {
  repositories {
    maven { url 'http://releases.marmeladburk.fidesmo.com/' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://mvn.javacard.pro/maven/' }
  }

  dependencies {
    classpath 'com.fidesmo:gradle-javacard:0.2.7'
  }
}

javacard {
  sdkVersion = "3.0.4"

  cap {
    aid = '0x53:0x61:0x74:0x6F:0x43:0x68:0x69:0x70'
    packageName = 'org.satochip.applet'
    applet {
      aid = '0x53:0x61:0x74:0x6F:0x43:0x68:0x69:0x70:0x00'
      className = 'CardEdge'
    }
    applet {
      aid = '0x53:0x61:0x74:0x6F:0x43:0x68:0x69:0x70:0x01'
      className = 'NDEFApplet'
    }
    version = '0.1'
  }
}

repositories {
  mavenCentral()
  maven { url 'https://jitpack.io' }
  maven { url 'https://mvn.javacard.pro/maven/' }
}

dependencies {
}

task install (type: org.satochip.build.InstallTask)
tasks.install.dependsOn(convertJavacard)

// DESTRUCTIVE: running this task permanently prevents deleting, updating or
// reinstalling the applet on the card. See the README before using it.
task lock (type: org.satochip.build.LockTask)

compileJava {
  sourceCompatibility = 1.6
  targetCompatibility = 1.6
}
